name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & unit tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff lint
        # 버전을 로그에 남긴다. 린터 버전이 올라가 규칙이 달라졌을 때
        # 코드 변경과 구분해서 원인을 짚을 수 있어야 한다.
        run: |
          ruff --version
          ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Unit tests
        # PostgreSQL이 필요한 동시성 테스트는 아래 job에서 따로 돌린다
        run: pytest -m "not postgres"

  postgres-concurrency:
    name: Concurrency integration tests (PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: maxlevelant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Alembic upgrade (fresh database)
        # 운영 dialect에서 마이그레이션이 실제로 도는지 먼저 확인한다.
        # 여기서 깨지면 배포가 통째로 막히므로 테스트보다 앞에 둔다.
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/maxlevelant_migration
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c \
            "CREATE DATABASE maxlevelant_migration;"
          alembic upgrade head

      - name: Alembic schema matches models
        # 마이그레이션 결과와 models.py가 어긋나면 autogenerate가 차이를 낸다.
        # (모델만 고치고 리비전을 안 만든 경우를 여기서 잡는다)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/maxlevelant_migration
        run: alembic check

      - name: Concurrency & migration tests
        # 거래/보상 정합성은 PostgreSQL row lock에 의존하므로
        # SQLite로는 검증할 수 없다. 실제 PostgreSQL에 붙여 확인한다.
        # 마이그레이션 테스트(기존 DB 수렴)도 같은 DB에서 함께 돈다.
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/maxlevelant_test
        run: pytest -m postgres -v
