# Alembic 설정
#
# DB URL은 여기에 적지 않는다. migrations/env.py가 settings.DATABASE_URL
# (= 환경변수 DATABASE_URL)에서 읽어오므로, 운영/로컬/CI가 같은 설정 경로를 쓴다.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# sqlalchemy.url은 env.py에서 주입한다 (비워 둘 것)
sqlalchemy.url =

# 새 리비전 생성 후 자동 포맷 (CI의 `ruff format --check`와 맞추기 위함).
# console_scripts 대신 exec를 쓴다 — ruff가 단독 바이너리로 설치된 환경에서도
# 동작해야 하기 때문이다.
[post_write_hooks]
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
