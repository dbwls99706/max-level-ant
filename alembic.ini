# Alembic config.
#
# Keep this file ASCII-only. Alembic reads it with encoding="locale", so a
# non-UTF-8 locale (e.g. cp949 on Korean Windows) cannot decode Korean text
# here and every alembic command dies before it starts. The rationale that
# used to live in these comments is in migrations/env.py, which Python always
# reads as UTF-8.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# Injected by env.py from DATABASE_URL - leave empty.
sqlalchemy.url =

# Auto-format new revisions so they pass CI's `ruff format --check`.
# Uses exec rather than console_scripts so a standalone ruff binary works too.
[post_write_hooks]
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
