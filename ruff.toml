# Ruff 설정
#
# 규칙 집합을 저장소에 명시해 둔다.
#
# 왜 필요한가: 설정 파일이 없으면 ruff의 '기본 규칙'을 그대로 따르는데,
# 이 기본값은 ruff 버전마다 달라진다. 실제로 0.16이 기본 규칙을 59개에서
# 413개로 확장하면서, 코드를 한 줄도 안 고쳤는데 CI가 lint에서 실패했다.
# select를 명시하면 기본 규칙 집합을 '대체'하므로, 무엇을 검사할지는
# 설치된 ruff 버전이 아니라 이 파일이 결정한다.
#
# 이 파일은 '규칙'을 고정하고, requirements-dev.txt의 정확한 버전 핀은
# '도구 동작'(포매터 스타일·검사 대상)을 고정한다. 둘 다 있어야 재현된다.

target-version = "py311"
line-length = 88

[lint]
# 현재 코드베이스가 지키는 규칙 집합 (구 ruff 기본값과 동일).
#   E4 - import 관련 pycodestyle
#   E7 - 문장 관련 pycodestyle
#   E9 - 구문/IO 오류
#   F  - pyflakes (미사용 import, 정의되지 않은 이름 등)
#
# 0.16 기본값에 새로 들어온 UP(pyupgrade)·RUF 등은 아직 켜지 않았다.
# 켜면 500건 이상이 한 번에 잡히는 순수 스타일 변경이라, 기능 변경과
# 리뷰 단위를 섞지 않도록 별도 작업으로 분리한다.
select = ["E4", "E7", "E9", "F"]
